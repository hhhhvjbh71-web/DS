<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>لا يوجد اتصال بالإنترنت — منصة الخلية — أ/ إسلام عبدالواحد</title>
<style>
  :root{
    --bg:#F7FCFD; --card:#ffffff; --text:#0B2536; --muted:#64748B;
    --primary:#06B6D4; --primary-dark:#0E7490;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal','Segoe UI',Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .card{
    background:var(--card); border-radius:20px; padding:40px 28px;
    max-width:380px; width:100%; text-align:center;
    box-shadow:0 10px 40px rgba(15,23,42,0.08);
  }
  .icon{
    width:72px; height:72px; margin:0 auto 20px; border-radius:18px;
    background:linear-gradient(135deg,#0F172A,#1E293B);
    display:flex; align-items:center; justify-content:center;
    font-size:32px;
  }
  h1{font-size:1.15rem; font-weight:800; margin-bottom:10px;}
  p{color:var(--muted); font-size:0.92rem; line-height:1.7; margin-bottom:22px;}
  button{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff; border:none; border-radius:12px; padding:12px 28px;
    font-family:inherit; font-weight:700; font-size:0.95rem; cursor:pointer;
    box-shadow:0 6px 18px rgba(6, 182, 212,0.35);
  }
  button:active{transform:scale(0.97);}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل بالإنترنت حاليًا. تحقق من الاتصال وحاول مرة أخرى للوصول إلى المنصة.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
